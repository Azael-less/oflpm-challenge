<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OFLPM · Administración</title><link rel="stylesheet" href="style.css"><style>body{min-height:100vh}.admin{margin:0 auto;max-width:960px;padding:64px 24px}.admin-head{border-bottom:1px solid var(--line);margin-bottom:24px;padding-bottom:20px}.admin-head h1{font-size:34px;margin:5px 0}.admin-login,.admin-list{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px}.admin-login{display:flex;gap:10px}.admin input{background:#080d15;border:1px solid var(--line);border-radius:5px;color:var(--text);flex:1;padding:12px}.admin button{background:var(--brass);border:0;border-radius:5px;color:#061018;cursor:pointer;font-weight:700;padding:10px 14px}.admin-status{color:var(--text-muted);font-size:12px;margin:14px 0}.admin-row{align-items:center;border-top:1px solid var(--line);display:grid;gap:14px;grid-template-columns:92px 1fr auto;padding:13px 0}.admin-row img{border-radius:5px;height:58px;object-fit:cover;width:92px}.admin-row strong,.admin-row span{display:block}.admin-row span{color:var(--text-muted);font-size:12px}.admin-delete{background:transparent!important;border:1px solid var(--loss)!important;color:var(--loss)!important}@media(max-width:600px){.admin-row{grid-template-columns:66px 1fr}.admin-row img{height:44px;width:66px}.admin-delete{grid-column:1/-1}}</style></head><body><main class="admin"><header class="admin-head"><p class="section-kicker">Acceso privado</p><h1>Moderación de jugadas</h1><p>Eliminar aquí borra el vídeo de Cloudinary y su registro de Supabase.</p></header><section id="login" class="admin-login"><input id="password" type="password" placeholder="Contraseña de administrador" autocomplete="current-password"><button id="enter">Entrar</button></section><p id="status" class="admin-status"></p><section id="list" class="admin-list" hidden></section></main><script>let secret="";const status=document.getElementById("status"),list=document.getElementById("list");async function load(){status.textContent="Cargando clips…";const r=await fetch('/api/admin/plays',{headers:{Authorization:'Bearer '+secret}});const d=await r.json();if(!r.ok)throw Error(d.error);list.hidden=false;list.innerHTML=d.plays.length?d.plays.map(p=>`<article class="admin-row"><img src="${p.thumbnail_url||''}" alt=""><div><strong>${p.title}</strong><span>${p.player_name} · ♥ ${p.hearts??p.votes??0} · 😂 ${p.laughs||0}</span></div><button class="admin-delete" data-id="${p.id}">Eliminar</button></article>`).join(''):'<p>No hay clips publicados.</p>';list.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar este vídeo definitivamente?'))return;const r=await fetch('/api/admin/plays/'+b.dataset.id,{method:'DELETE',headers:{Authorization:'Bearer '+secret}});const d=await r.json();if(!r.ok)alert(d.error);else load();});status.textContent='';}document.getElementById('enter').onclick=async()=>{secret=document.getElementById('password').value;try{await load();document.getElementById('login').hidden=true;}catch(e){status.textContent=e.message;}};</script></body></html>
